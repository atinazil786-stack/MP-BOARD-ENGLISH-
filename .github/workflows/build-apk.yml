name: Build MP Board English Hub APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build MP Board English Hub APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android Project if zipped
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE"
              SUBDIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -printf "%h\n" | head -n 1 || true)
              if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
                cp -r "$SUBDIR"/* .
                cp -r "$SUBDIR"/.[!.]* . 2>/dev/null || true
              fi
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          SDK_MANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null || true
          fi

      - name: Restore debug.keystore for app signing
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP-Board-English-Hub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
